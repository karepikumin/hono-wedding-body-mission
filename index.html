<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff0f6"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wedding Mission"><link rel="manifest" href="./manifest.webmanifest">
<title>Wedding Body Mission 💐</title>
<style>
body{margin:0;background:linear-gradient(#fff7fa,#fff);font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;color:#4a3b42}
main{max-width:560px;margin:auto;padding:20px 17px 40px}.hero,.card{background:#fff;border:1px solid #f3dce5;border-radius:24px;padding:19px;margin-bottom:14px;box-shadow:0 6px 20px #eadce233}
.hero{background:linear-gradient(135deg,#fff,#ffeaf2)}h1{font-size:24px;margin:0 0 5px}.sub,.small{color:#8d7d84;font-size:13px;line-height:1.6}.count{font-size:34px;font-weight:800;margin-top:12px}
.label{font-size:12px;color:#d45b83;font-weight:800;letter-spacing:.08em}.mission{font-size:21px;font-weight:800;margin:8px 0}.desc{font-size:14px;line-height:1.7}
button{border:0;border-radius:15px;padding:13px 16px;font-weight:800;font-size:15px}.primary{background:#f58fb0;color:#fff;width:100%;margin-top:12px}.secondary{background:#ffe8f1;color:#b94f76}
.row{display:flex;gap:9px;align-items:center}.row button{flex:1}input{border:1px solid #f3dce5;border-radius:12px;padding:10px}
.stamp{text-align:center;font-size:42px}.done{text-align:center;color:#d45b83;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{aspect-ratio:1;border:1px solid #f3dce5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px}.day.done{background:#ffe3ee}
.badge{display:inline-block;background:#fff0f6;border-radius:99px;padding:5px 8px;margin:2px;font-size:11px}
</style></head><body><main>
<section class="hero"><h1>💐 Wedding Body Mission</h1><div class="sub">ほのちゃんの結婚式まで、1日1ミッション♡</div><div id="count" class="count"></div></section>
<section class="card"><div class="label">TODAY'S MISSION</div><div id="mission" class="mission"></div><div id="desc" class="desc"></div>
<button id="done" class="primary">♡ 今日のミッション達成！</button><div id="doneMsg"></div>
<button id="easy" class="secondary" style="width:100%;margin-top:9px">3分だけやる</button></section>
<section class="card"><div class="label">🔔 REMINDER</div><p class="small">通知を許可するボタンだよ。アプリを閉じても届く本物のプッシュ通知は、OneSignalなどのWeb Pushサービス接続後に使えるようになるよ。</p>
<div class="row"><input id="time" type="time" value="20:00"><button id="notify" class="secondary">通知を許可</button></div><p id="notifyMsg" class="small"></p></section>
<section class="card"><div class="label">📅 STREAK</div><p id="stats"></p><div id="badges"></div><div id="calendar" class="calendar"></div></section>
<section class="card"><div class="label">💗 データについて</div><p class="small">達成状況はこのiPhone内に保存。体重などをサーバーへ送らない設計だよ。</p></section>
</main>
<script>
const WEDDING=new Date("2026-10-24T00:00:00+09:00");
const missions=[["下っ腹","デッドバグ10回×2＋リバースクランチ10回×2","腰を反らしすぎずゆっくり♡"],["二の腕","壁プッシュアップ12回×2＋トライセプス伸ばし12回×2","肩をすくめずゆっくり。"],["背中・姿勢","ペットボトルロー12回×2＋肩甲骨寄せ15回×2","胸を軽く開いて♡"],["お腹＋腕","プランク20秒×2＋壁プッシュアップ12回×2","きつければ3分版でOK！"],["歩く日","食後10〜15分ウォーキング","ゆっくりでも大丈夫◎"],["回復","ストレッチ5分＋深呼吸","休むのもミッション♡"],["ごほうび","好きな音楽1曲＋軽いストレッチ","続けた自分をほめる日♡"]];
const key=d=>d.toISOString().slice(0,10),today=new Date(),tk=key(today);
const store=JSON.parse(localStorage.getItem("honoMission")||"{}");
function render(){document.querySelector("#count").textContent="あと "+Math.max(0,Math.ceil((WEDDING-new Date())/86400000))+" 日";
let i=Math.floor((today-new Date("2026-09-20T00:00:00+09:00"))/86400000)%missions.length,m=missions[(i+7)%7];
document.querySelector("#mission").textContent=m[0];document.querySelector("#desc").innerHTML=m[1]+"<br>"+m[2];
if(store[tk]){document.querySelector("#doneMsg").innerHTML='<div class="stamp">🎀</div><div class="done">今日もえらいっ♡</div>';document.querySelector("#done").disabled=true}
let dates=Object.keys(store),streak=0,d=new Date();while(store[key(d)]){streak++;d.setDate(d.getDate()-1)}
document.querySelector("#stats").textContent=dates.length+"日達成 / "+streak+"日連続";
document.querySelector("#badges").innerHTML=[1,3,7,14,21,30].filter(n=>dates.length>=n).map(n=>'<span class="badge">🏅 '+n+'日</span>').join("");
let c="";for(let j=29;j>=0;j--){let x=new Date();x.setDate(x.getDate()-j);c+='<div class="day '+(store[key(x)]?"done":"")+'">'+x.getDate()+"</div>"}document.querySelector("#calendar").innerHTML=c}
document.querySelector("#done").onclick=()=>{store[tk]=Date.now();localStorage.setItem("honoMission",JSON.stringify(store));render()};
document.querySelector("#easy").onclick=()=>alert("🌷 3分版\n壁プッシュアップ10回 → デッドバグ左右5回 → 肩甲骨寄せ15回 → 深呼吸♡");
document.querySelector("#notify").onclick=async()=>{if(!("Notification"in window)){notifyMsg.textContent="この環境では通知を利用できないよ🥺";return}let p=await Notification.requestPermission();notifyMsg.textContent=p==="granted"?"通知の許可OK♡ 次はOneSignal接続で本格的なプッシュ通知にできるよ！":"通知はまだ許可されてないよ。iPhoneの設定から変更できるよ。"};
render();
</script></body></html>
